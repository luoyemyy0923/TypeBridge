[versions]
agp = "9.1.0"
kotlin = "2.3.20"
ksp = "2.3.9"
coreKtx = "1.18.0"
composeBom = "2026.05.00"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
kotlinxSerializationJson = "1.10.0"
